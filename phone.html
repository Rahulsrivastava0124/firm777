<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
</head>


<body class=" ">
    <h1 class="py-2 bg-gray-800 text-yellow-500 text-center">Phone Update</h1>
    <div class="mx-auto max-w-screen-xl px-4 mt-4">
        <div class="flex gap-2">
            <button id="tabMainBtn" class="px-4 py-2 rounded bg-indigo-600 text-white text-sm">Home</button>
            <button id="tabCarouselBtn" class="px-4 py-2 rounded bg-gray-200 text-gray-800 text-sm">Carousel
                Upload</button>
            <button id="tabSubdomainBtn" class="px-4 py-2 rounded bg-gray-200 text-gray-800 text-sm">Subdomain</button>
        </div>
    </div>

    <div id="tab-content-main" class="mt-2">
        <form class="w-52 m-auto " onsubmit="updatePhone(event)">
            <label for="email" class="sr-only">Phone Update</label>
            <div class="relative">
                <input type="number" id="phone"
                    class="w-full mt-3 rounded-lg border-gray-200 p-4 pe-12 text-sm shadow-sm border border-gray-300"
                    placeholder="Enter Phone" />
            </div>
            <button type="submit"
                class="block w-full rounded-lg bg-indigo-600 px-5 py-3 text-sm font-medium text-white">
                Update
            </button>
        </form>
        <form class="mt-5 " onsubmit="CreatePromo(event)">
            <div class=" sm:w-[20%] flex items-center m-auto">
                <div class="mb-2">
                    <label for="promoCode" class="sr-only">PromoCode</label>
                    <div class="relative">
                        <input type="test" id="promocode" oninput="this.value = this.value.toUpperCase()"
                            class="w-full rounded-lg border-gray-200 p-4 pe-12 text-sm shadow-sm border border-gray-300"
                            placeholder="PromoCode" />
                    </div>
                </div>
                <button type="submit" class="ms-3 rounded-lg bg-indigo-600 px-5 py-3 text-sm font-medium text-white">
                    Create
                </button>
            </div>
            </from>
            <div>
                <div class=" sm:w-[15%] m-auto">
                    <div class="w-full max-w-[16rem] flex items-center">
                        <input type="text" value="" id="myInput" class="input border border-gray-300 p-4 rounded">
                        <!-- The button used to copy the text -->
                        <button onclick="myFunction()" class="bg-indigo-600 m-2 p-2 rounded text-3xl">📒</button>
                    </div>
                </div>
            </div>

            <!-- user table  -->

            <!--
  Heads up! 👋

  This component comes with some `rtl` classes. Please remove them if they are not needed in your project.
-->

            <div class="overflow-x-auto rounded-lg border border-gray-200 mt-4 ">
                <table class="min-w-full divide-y-2 divide-gray-200 bg-white text-sm">
                    <h5 class="text-center bg-gray-800 text-yellow-500 text-xl">USERS</h5>
                    <thead class="ltr:text-left rtl:text-right">
                        <tr>
                            <th class="whitespace-nowrap px-4 py-2 font-medium text-gray-900">Name</th>
                            <th class="whitespace-nowrap px-4 py-2 font-medium text-gray-900">Phone</th>
                            <th class="whitespace-nowrap px-4 py-2 font-medium text-gray-900">Promo Code</th>
                        </tr>
                    </thead>

                    <tbody class="divide-y divide-gray-200" id="myTable">

                    </tbody>
                </table>
            </div>
    </div>

    <div id="tab-content-carousel" style="display:none" class="mx-auto max-w-screen-xl px-4 mt-6">
        <div class="sm:w-[50%] m-auto">
            <h2 class="text-lg font-semibold mb-3">Carousel Images</h2>
            <div class="mb-3">
                <button id="addSlideBtn" class="px-3 py-2 rounded bg-indigo-600 text-white text-sm">Add Slide</button>
            </div>
            <div id="dynamicSlides" class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4"></div>
        </div>
    </div>

    <div id="tab-content-subdomain" style="display:none" class="mx-auto max-w-screen-xl px-4 mt-6">
        <div class="sm:w-[50%] m-auto">
            <h2 class="text-lg font-semibold mb-3">Subdomain Number</h2>
            <div class="grid gap-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label for="sdName" class="block text-sm text-gray-700 mb-1">Subdomain name</label>
                        <input type="text" id="sdName"
                            class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                            placeholder="e.g. vip1" />
                    </div>
                    <div>
                        <label for="sdPhone" class="block text-sm text-gray-700 mb-1">Phone number</label>
                        <input type="number" id="sdPhone"
                            class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                            placeholder="Enter phone number" />
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button id="sdAddUpdateBtn" class="px-4 py-2 rounded bg-indigo-600 text-white text-sm">Add /
                        Update</button>
                    <button id="sdClearBtn" class="px-4 py-2 rounded bg-gray-200 text-gray-800 text-sm">Clear</button>
                </div>

                <div class="mt-4">
                    <h3 class="font-medium mb-2">Mappings</h3>
                    <div class="overflow-x-auto rounded border border-gray-200">
                        <table class="min-w-full text-sm">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-3 py-2 text-left">Subdomain</th>
                                    <th class="px-3 py-2 text-left">Phone</th>
                                    <th class="px-3 py-2 text-left">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="sdTableBody" class="divide-y"></tbody>
                        </table>
                    </div>
                </div>

                <div class="mt-6">
                    <h3 class="font-medium mb-2">Lookup & Generate</h3>
                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-center">
                        <input type="text" id="sdLookupName"
                            class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                            placeholder="Enter subdomain name" />
                        <button id="sdLookupBtn"
                            class="px-4 py-2 rounded bg-indigo-600 text-white text-sm">Lookup</button>
                        <input type="text" id="sdLookupPhone" readonly
                            class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                            placeholder="Phone will appear here" />
                    </div>
                    <div class="flex items-center gap-2 mt-3">
                        <input type="text" id="subdomainUrl" readonly
                            class="flex-1 rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                            placeholder="https://<subdomain>.firm777.com" />
                        <button id="copySubdomainBtn"
                            class="px-3 py-2 rounded bg-gray-200 text-gray-800 text-sm">Copy</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
<script src="/admin.js"></script>

</html>
