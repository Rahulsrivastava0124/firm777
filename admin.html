<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  </head>

  <body class="bg-gray-50">
    <div class="min-h-screen flex">
      <!-- Sidebar -->
      <aside
        class="w-64 bg-white border-r border-gray-200 hidden sm:flex sm:flex-col"
      >
        <div class="h-14 flex items-center px-4 border-b border-gray-200">
          <span class="text-base font-semibold text-gray-800">Admin Panel</span>
        </div>
        <nav class="p-4 space-y-2">
          <button
            id="tabMainBtn"
            class="w-full text-left px-3 py-2 rounded bg-indigo-600 text-white text-sm"
          >
            Home
          </button>
          <button
            id="tabCarouselBtn"
            class="w-full text-left px-3 py-2 rounded bg-gray-200 text-gray-800 text-sm"
          >
            Carousel Upload
          </button>
          <button
            id="tabSubdomainBtn"
            class="w-full text-left px-3 py-2 rounded bg-gray-200 text-gray-800 text-sm"
          >
            Subdomain
          </button>
        </nav>
      </aside>

      <!-- Main area -->
      <div class="flex-1 flex flex-col">
        <!-- Topbar -->
        <header
          class="h-14 bg-gray-800 text-yellow-500 flex items-center justify-between px-4"
        >
          <h1 class="text-sm sm:text-base font-medium">Phone Admin</h1>
          <!-- Mobile nav -->
          <div class="sm:hidden flex gap-2">
            <button
              id="mobileTabMainBtn"
              class="px-3 py-1 rounded bg-indigo-600 text-white text-xs"
            >
              Home
            </button>
            <button
              id="mobileTabCarouselBtn"
              class="px-3 py-1 rounded bg-gray-200 text-gray-800 text-xs"
            >
              Carousel
            </button>
            <button
              id="mobileTabSubdomainBtn"
              class="px-3 py-1 rounded bg-gray-200 text-gray-800 text-xs"
            >
              Subdomain
            </button>
          </div>
        </header>

        <!-- Content -->
        <main class="p-4">
          <div id="tab-content-main" class="mt-2">
            <div
              class="overflow-x-auto rounded-lg border border-gray-200 bg-white"
            >
              <div class="px-4 py-2 border-b border-gray-200 bg-gray-50">
                <h5 class="text-sm font-semibold text-gray-700">USERS</h5>
              </div>
              <table class="min-w-full divide-y-2 divide-gray-200 text-sm">
                <thead class="bg-white ltr:text-left rtl:text-right">
                  <tr>
                    <th
                      class="whitespace-nowrap px-4 py-2 font-medium text-gray-900"
                    >
                      Name
                    </th>
                    <th
                      class="whitespace-nowrap px-4 py-2 font-medium text-gray-900"
                    >
                      Phone
                    </th>
                    <th
                      class="whitespace-nowrap px-4 py-2 font-medium text-gray-900"
                    >
                      Promo Code
                    </th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-gray-200" id="myTable"></tbody>
              </table>
            </div>
          </div>

          <div
            id="tab-content-carousel"
            style="display: none"
            class="mx-auto max-w-screen-xl px-0 mt-6"
          >
            <div class="sm:w-[70%] m-auto">
              <h2 class="text-lg font-semibold mb-3">Carousel Images</h2>
              <div class="mb-3">
                <button
                  id="addSlideBtn"
                  class="px-3 py-2 rounded bg-indigo-600 text-white text-sm"
                >
                  Add Slide
                </button>
              </div>
              <div
                id="dynamicSlides"
                class="mt-4 grid grid-cols-1 sm:grid-cols-2 gap-4"
              ></div>
            </div>
          </div>

          <div
            id="tab-content-subdomain"
            style="display: none"
            class="mx-auto max-w-screen-xl px-0 mt-6"
          >
            <div class="sm:w-[70%] m-auto">
              <h2 class="text-lg font-semibold mb-3">Subdomain Number</h2>
              <div class="grid gap-3">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                  <div>
                    <label for="sdName" class="block text-sm text-gray-700 mb-1"
                      >Subdomain name</label
                    >
                    <input
                      type="text"
                      id="sdName"
                      class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                      placeholder="e.g. vip1"
                    />
                  </div>
                  <div>
                    <label
                      for="sdPhone"
                      class="block text-sm text-gray-700 mb-1"
                      >Phone number</label
                    >
                    <input
                      type="number"
                      id="sdPhone"
                      class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                      placeholder="Enter phone number"
                    />
                  </div>
                </div>
                <div class="flex items-center gap-2">
                  <button
                    id="sdAddUpdateBtn"
                    class="px-4 py-2 rounded bg-indigo-600 text-white text-sm"
                  >
                    Add / Update
                  </button>
                  <button
                    id="sdClearBtn"
                    class="px-4 py-2 rounded bg-gray-200 text-gray-800 text-sm"
                  >
                    Clear
                  </button>
                </div>
                <div class="mt-4">
                  <h3 class="font-medium mb-2">Mappings</h3>
                  <div
                    class="overflow-x-auto rounded border border-gray-200 bg-white"
                  >
                    <table class="min-w-full text-sm">
                      <thead class="bg-gray-50">
                        <tr>
                          <th class="px-3 py-2 text-left">Subdomain</th>
                          <th class="px-3 py-2 text-left">Phone</th>
                          <th class="px-3 py-2 text-left">Actions</th>
                        </tr>
                      </thead>
                      <tbody id="sdTableBody" class="divide-y"></tbody>
                    </table>
                  </div>
                </div>
                <div class="mt-6">
                  <h3 class="font-medium mb-2">Lookup & Generate</h3>
                  <div
                    class="grid grid-cols-1 sm:grid-cols-3 gap-3 items-center"
                  >
                    <input
                      type="text"
                      id="sdLookupName"
                      class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                      placeholder="Enter subdomain name"
                    />
                    <button
                      id="sdLookupBtn"
                      class="px-4 py-2 rounded bg-indigo-600 text-white text-sm"
                    >
                      Lookup
                    </button>
                    <input
                      type="text"
                      id="sdLookupPhone"
                      readonly
                      class="w-full rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                      placeholder="Phone will appear here"
                    />
                  </div>
                  <div class="flex items-center gap-2 mt-3">
                    <input
                      type="text"
                      id="subdomainUrl"
                      readonly
                      class="flex-1 rounded-lg border-gray-200 p-3 text-sm shadow-sm border border-gray-300"
                      placeholder="https://<subdomain>.firm777.com"
                    />
                    <button
                      id="copySubdomainBtn"
                      class="px-3 py-2 rounded bg-gray-200 text-gray-800 text-sm"
                    >
                      Copy
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
  <script src="/admin.js"></script>
</html>
